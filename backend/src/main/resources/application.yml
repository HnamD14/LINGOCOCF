# ══════════════════════════════════════════════════════════════════
# 🐸 LingoCóc — application.yml
# Chỉ dùng PostgreSQL. Chọn profile phù hợp:
#   local  → mvn spring-boot:run -Dspring-boot.run.profiles=local
#   prod   → SPRING_PROFILES_ACTIVE=prod (Docker / VPS)
# ══════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILE:local}

  datasource:
    url:               jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lingococ}
    driver-class-name: org.postgresql.Driver
    username:          ${DB_USER:postgres}
    password:          ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
      mail.smtp.socketFactory.port: 465
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
      mail.smtp.socketFactory.fallback: false
      mail.debug: true

# ── JWT ──────────────────────────────────────────────────────────
jwt:
  secret:     ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ── App ──────────────────────────────────────────────────────────
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# ── Rate Limiting ─────────────────────────────────────────────────
rate-limit:
  login:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window-ms:    ${RATE_LIMIT_WINDOW_MS:60000}

# ── Payment & AI ─────────────────────────────────────────────────
sepay:
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:YOUR_SEPAY_WEBHOOK_SECRET_HERE}

# ── Anthropic Claude AI ───────────────────────────────────────────
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model:   ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
