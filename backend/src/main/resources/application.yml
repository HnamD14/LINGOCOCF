server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILE:local}

  datasource:
    url:               jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lingococ}
    driver-class-name: org.postgresql.Driver
    username:          ${DB_USER:postgres}
    password:          ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Gmail SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret:     ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

rate-limit:
  login:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window-ms:    ${RATE_LIMIT_WINDOW_MS:60000}

sepay:
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:YOUR_SEPAY_WEBHOOK_SECRET_HERE}

# ── Email đã cấu hình qua spring.mail ở trên ──

# ── Anthropic Claude AI ────────────────────────────────────────────
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model:   ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
